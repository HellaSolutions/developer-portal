server:
  shutdown: graceful

spring:
  application:
    name: "developer-portal"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.elsevier.com/realms/platform
  lifecycle:
    timeout-per-shutdown-phase: 25s
  jpa:
    hibernate:
      ddl-auto: "validate"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
    heapdump:
      access: none

logging:
  structured:
    format:
      console: ecs
  level:
    com.media.portal: INFO

